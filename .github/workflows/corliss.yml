# Corliss CI. Every check is a `cargo xtask` command that runs the same way locally.
#
# Pacing (AGENTS.md "CI pacing"):
#   - pull requests run the PR gate and the full matrix (Linux x86_64, macOS x86_64 and
#     arm64, Windows x64); `main` requires every one of them to pass before a merge;
#   - a `v*` tag push, or a manual dispatch with mode=release, runs the full matrix plus the
#     release check;
#   - a `v*` tag push then creates the GitHub release and, when the CARGO_REGISTRY_TOKEN
#     secret is set, publishes to crates.io.
# Branch pushes do not trigger the workflow; dispatch it on the pushed SHA instead.
name: corliss

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mode:
        description: "pr: the Linux PR gate; release: full matrix plus the release check"
        type: choice
        options: [pr, release]
        default: pr
      version:
        description: "Release version X.Y.Z (release mode only)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are dropped; release runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  pr:
    name: PR gate (Linux x86_64)
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'pr')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # The format check diffs against the merge base with the PR's base branch.
          fetch-depth: 0
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)".*/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo xtask pr
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: cargo xtask pr --base "$BASE_REF"

  full:
    name: Full gate (${{ matrix.name }})
    if: github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
          - name: macOS x86_64
            os: macos-15-intel
          - name: macOS arm64
            os: macos-15
          - name: Windows x64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      # Windows runners default to core.autocrlf=true, which would rewrite text fixtures and
      # sources; the gates must see the committed bytes.
      - name: Keep committed line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)".*/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo xtask full
        run: cargo xtask full

  release-check:
    name: Release check
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # The bump-size rule compares with the latest earlier v* tag.
          fetch-depth: 0
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)".*/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo xtask release
        env:
          # Tag pushes release the tag's version; a dispatch releases the `version` input.
          VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: cargo xtask release "$VERSION"

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [full, release-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      HAS_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)".*/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Write the release notes from CHANGELOG.md
        run: cargo xtask release "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Package the crate
        run: cargo package --package corliss --locked
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "target/package/corliss-$version.crate" \
            --verify-tag \
            --title "Corliss $version" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Publish to crates.io
        if: env.HAS_REGISTRY_TOKEN == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --package corliss --locked
      - name: Skip crates.io
        if: env.HAS_REGISTRY_TOKEN != 'true'
        run: echo "CARGO_REGISTRY_TOKEN is not set; skipping cargo publish."
